name: Desktop Build

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: desktop/node_modules
          key: desktop-npm-linux-${{ hashFiles('desktop/package-lock.json', 'desktop/package.json') }}
          restore-keys: |
            desktop-npm-linux-

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync desktop version from pyproject.toml
        run: python scripts/sync-version.py

      - name: Override version from git tag (safety net)
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_VER="${{ github.event.release.tag_name }}"
            TAG_VER="${TAG_VER#v}"
            echo "Injecting tag version: $TAG_VER"
            python3 -c "import json,sys; pkg=json.load(open('desktop/package.json')); old=pkg['version']; pkg['version']=sys.argv[1]; json.dump(pkg, open('desktop/package.json','w'), indent=2); print(f'desktop/package.json: {old} -> {sys.argv[1]} (from tag)')" "$TAG_VER"
          else
            echo "No release tag — using pyproject.toml version"
          fi

      - name: Install UPX compressor
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl binutils xz-utils fakeroot
          which upx && upx --version | head -1 || echo "UPX not available"

      - name: Build backend binary + Electron app
        shell: bash
        run: |
          # Pin PyInstaller: 6.22.0 (released 2026-08-08) hangs Windows binary analysis
          # at "Looking for dynamic libraries" (43 min, no progress). 6.21.0 is proven
          # by 3 consecutive green desktop builds (Jun 30 - Aug 6).
          pip install pyinstaller==6.21.0
          pip install -e ".[system,z3]"
          Z3_LIB=$(python3 << 'PYEOF'
          import z3, os, sys, glob
          ext_map = {'win32': '.dll', 'cygwin': '.dll', 'darwin': '.dylib'}
          ext = ext_map.get(sys.platform, '.so')
          lib_dir = os.path.join(os.path.dirname(z3.__file__), 'lib')
          if not os.path.isdir(lib_dir):
              lib_dir = os.path.join(os.path.dirname(z3.__file__))
          matches = glob.glob(os.path.join(lib_dir, f'*z3*{ext}')) or glob.glob(os.path.join(lib_dir, f'libz3*'))
          print(matches[0] if matches else os.path.join(lib_dir, f'libz3{ext}'))
          PYEOF
          )
          UPX_FLAG=""
          which upx >/dev/null 2>&1 && UPX_FLAG="--upx-dir $(dirname $(which upx))"
          pyinstaller --onedir --noconsole --noconfirm \
            --name udr-backend \
            $UPX_FLAG \
            --add-binary "$Z3_LIB:z3/lib/" \
            --distpath backend/dist \
            --workpath ${{ runner.temp }}/pyibuild \
            backend/run.py
          pushd desktop
          npm install
          npx electron-builder --linux --publish=never
          popd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test built binary
        shell: bash
        run: |
          node --test tests/smoke.test.js
        working-directory: desktop

      - name: Headless render test (Xvfb)
        shell: bash
        run: |
          sudo apt-get install -y -qq xvfb 2>/dev/null || true
          node --test tests/render.test.js
        working-directory: desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udr-desktop-linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release' || startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          shopt -s nullglob
          for f in desktop/release/*; do
            base=$(basename "$f")
            case "$base" in
              *.AppImage|*.deb)
                echo "Uploading $base to release $TAG..."
                gh release upload "$TAG" "$f" --clobber
                ;;
              *)
                echo "Skipping $base"
                ;;
            esac
          done

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: desktop/node_modules
          key: desktop-npm-windows-${{ matrix.arch }}-${{ hashFiles('desktop/package-lock.json', 'desktop/package.json') }}
          restore-keys: |
            desktop-npm-windows-${{ matrix.arch }}-

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync desktop version from pyproject.toml
        run: python scripts/sync-version.py

      - name: Override version from git tag (safety net)
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_VER="${{ github.event.release.tag_name }}"
            TAG_VER="${TAG_VER#v}"
            echo "Injecting tag version: $TAG_VER"
            python3 -c "import json,sys; pkg=json.load(open('desktop/package.json')); old=pkg['version']; pkg['version']=sys.argv[1]; json.dump(pkg, open('desktop/package.json','w'), indent=2); print(f'desktop/package.json: {old} -> {sys.argv[1]} (from tag)')" "$TAG_VER"
          else
            echo "No release tag — using pyproject.toml version"
          fi

      - name: Install UPX compressor
        shell: bash
        run: |
          # UPX 5.x is incompatible with PyInstaller and can hang the build.
          # PyInstaller runs fine without UPX, so skip installing it on Windows.
          echo "Skipping UPX on Windows (UPX 5.x hangs PyInstaller)"

      - name: Probe package imports (PyInstaller hang diagnostics)
        shell: bash
        run: |
          pip install pyinstaller==6.21.0
          pip install -e ".[system,z3]"
          # PyInstaller hangs at "Looking for dynamic libraries" (43 min, twice):
          # its isolated subprocess imports every collected package one-by-one and
          # one of them blocks forever on this runner. Replicate that phase with
          # per-module timeouts so the culprit is named in ~2 min instead of a 45-min
          # timeout. Also sweep site-packages DLLs with pefile to rule out a
          # binary-analysis hang.
          python - <<'PYEOF'
          import subprocess, sys, time, pkgutil, os, glob
          TIMEOUT = 45
          print(f"[probe] python={sys.executable}", flush=True)
          mods = sorted({m.name for m in pkgutil.iter_modules() if '.' not in m.name})
          print(f"[probe] testing {len(mods)} top-level modules (subprocess each, {TIMEOUT}s timeout)", flush=True)
          culprit = None
          slow = []
          for m in mods:
              t0 = time.time()
              try:
                  r = subprocess.run([sys.executable, "-c", f"import {m}"], timeout=TIMEOUT, capture_output=True)
                  dt = time.time() - t0
                  if r.returncode != 0:
                      print(f"[probe] ERR({r.returncode}) {m}: {r.stderr.decode(errors='replace')[:120]!r}", flush=True)
                  elif dt > 5:
                      slow.append((m, round(dt, 1)))
                      print(f"[probe] SLOW {m} ({dt:.1f}s)", flush=True)
              except subprocess.TimeoutExpired:
                  culprit = m
                  print(f"[probe] HANG {m}  <-- culprit", flush=True)
                  break
          if culprit:
              print(f"[probe] CULPRIT: {culprit} blocks on import (PyInstaller hang root cause)", flush=True)
              sys.exit(1)
          print(f"[probe] all {len(mods)} imports OK; slow: {slow}", flush=True)
          try:
              import pefile, concurrent.futures
              sp = os.path.join(sys.base_prefix, 'Lib', 'site-packages')
              dlls = glob.glob(os.path.join(sp, '**', '*.dll'), recursive=True) + glob.glob(os.path.join(sp, '**', '*.pyd'), recursive=True)
              def check(path):
                  t0 = time.time()
                  try:
                      pe = pefile.PE(path, fast_load=True); pe.close()
                      return None if time.time() - t0 < 8 else ('SLOW', path, round(time.time() - t0, 1))
                  except Exception as e:
                      return ('ERR', path, str(e)[:100])
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
                  bad = [r for r in ex.map(check, dlls) if r]
              print(f"[probe] pefile sweep: {len(dlls)} binaries, {len(bad)} problematic: {bad}", flush=True)
          except Exception as e:
              print(f"[probe] pefile sweep skipped: {e}", flush=True)
          print("[probe] diagnostics done", flush=True)
          PYEOF

      - name: Build backend binary + Electron app
        shell: bash
        run: |
          # Pin PyInstaller: 6.22.0 (released 2026-08-08) hangs Windows binary analysis
          # at "Looking for dynamic libraries" (43 min, no progress). 6.21.0 is proven
          # by 3 consecutive green desktop builds (Jun 30 - Aug 6).
          pip install pyinstaller==6.21.0
          pip install -e ".[system,z3]"
          Z3_LIB=$(python3 << 'PYEOF'
          import z3, os, sys, glob
          ext_map = {'win32': '.dll', 'cygwin': '.dll', 'darwin': '.dylib'}
          ext = ext_map.get(sys.platform, '.so')
          lib_dir = os.path.join(os.path.dirname(z3.__file__), 'lib')
          if not os.path.isdir(lib_dir):
              lib_dir = os.path.join(os.path.dirname(z3.__file__))
          matches = glob.glob(os.path.join(lib_dir, f'*z3*{ext}')) or glob.glob(os.path.join(lib_dir, f'libz3*'))
          print(matches[0] if matches else os.path.join(lib_dir, f'libz3{ext}'))
          PYEOF
          )
          UPX_FLAG=""
          # UPX disabled on Windows — UPX 5.x hangs PyInstaller. Build without compression.
          # --log-level DEBUG: if the Windows build hangs again during binary analysis,
          # the workflow log will show exactly which DLL pefile is stuck on.
          pyinstaller --onedir --noconsole --noconfirm --log-level DEBUG \
            --name udr-backend \
            $UPX_FLAG \
            --add-binary "$Z3_LIB:z3/lib/" \
            --distpath backend/dist \
            --workpath ${{ runner.temp }}/pyibuild \
            backend/run.py
          pushd desktop
          npm install
          ARCH_FLAG=""
          if [[ "${{ runner.arch }}" == "ARM64" || "${{ matrix.arch }}" == "arm64" ]]; then
            ARCH_FLAG="--arm64"
          fi
          npx electron-builder --win $ARCH_FLAG --publish=never
          popd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test built binary
        shell: bash
        run: |
          node --test tests/smoke.test.js
        working-directory: desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udr-desktop-windows-${{ matrix.arch }}
          path: |
            desktop/release/*.exe
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release' || startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          shopt -s nullglob
          for f in desktop/release/*; do
            base=$(basename "$f")
            case "$base" in
              *.exe)
                echo "Uploading $base to release $TAG..."
                gh release upload "$TAG" "$f" --clobber
                ;;
              *)
                echo "Skipping $base"
                ;;
            esac
          done

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: desktop/node_modules
          key: desktop-npm-macos-${{ matrix.arch }}-${{ hashFiles('desktop/package-lock.json', 'desktop/package.json') }}
          restore-keys: |
            desktop-npm-macos-${{ matrix.arch }}-

      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync desktop version from pyproject.toml
        run: python scripts/sync-version.py

      - name: Override version from git tag (safety net)
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_VER="${{ github.event.release.tag_name }}"
            TAG_VER="${TAG_VER#v}"
            echo "Injecting tag version: $TAG_VER"
            python3 -c "import json,sys; pkg=json.load(open('desktop/package.json')); old=pkg['version']; pkg['version']=sys.argv[1]; json.dump(pkg, open('desktop/package.json','w'), indent=2); print(f'desktop/package.json: {old} -> {sys.argv[1]} (from tag)')" "$TAG_VER"
          else
            echo "No release tag — using pyproject.toml version"
          fi

      - name: Install UPX compressor
        shell: bash
        run: |
          brew install upx 2>/dev/null || echo "UPX not available via Homebrew"
          which upx && upx --version | head -1 || echo "UPX not available"

      - name: Build backend binary + Electron app
        shell: bash
        run: |
          # Pin PyInstaller: 6.22.0 (released 2026-08-08) hangs Windows binary analysis
          # at "Looking for dynamic libraries" (43 min, no progress). 6.21.0 is proven
          # by 3 consecutive green desktop builds (Jun 30 - Aug 6).
          pip install pyinstaller==6.21.0
          pip install -e ".[system,z3]"
          Z3_LIB=$(python3 << 'PYEOF'
          import z3, os, sys, glob
          ext_map = {'win32': '.dll', 'cygwin': '.dll', 'darwin': '.dylib'}
          ext = ext_map.get(sys.platform, '.so')
          lib_dir = os.path.join(os.path.dirname(z3.__file__), 'lib')
          if not os.path.isdir(lib_dir):
              lib_dir = os.path.join(os.path.dirname(z3.__file__))
          matches = glob.glob(os.path.join(lib_dir, f'*z3*{ext}')) or glob.glob(os.path.join(lib_dir, f'libz3*'))
          print(matches[0] if matches else os.path.join(lib_dir, f'libz3{ext}'))
          PYEOF
          )
          UPX_FLAG=""
          which upx >/dev/null 2>&1 && UPX_FLAG="--upx-dir $(dirname $(which upx))"
          pyinstaller --onedir --noconsole --noconfirm \
            --name udr-backend \
            $UPX_FLAG \
            --add-binary "$Z3_LIB:z3/lib/" \
            --distpath backend/dist \
            --workpath ${{ runner.temp }}/pyibuild \
            backend/run.py
          pushd desktop
          npm install
          npx electron-builder --mac --publish=never
          popd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test built binary
        shell: bash
        run: |
          node --test tests/smoke.test.js
        working-directory: desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udr-desktop-macos-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release' || startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          shopt -s nullglob
          for f in desktop/release/*; do
            base=$(basename "$f")
            case "$base" in
              *.dmg)
                echo "Uploading $base to release $TAG..."
                gh release upload "$TAG" "$f" --clobber
                ;;
              *)
                echo "Skipping $base"
                ;;
            esac
          done
